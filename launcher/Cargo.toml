[package]
name = "rn"
version = "0.1.8"
authors = ["pde"]
edition = "2021"
license = "MIT OR Apache-2.0"

# The installed entry point. Deliberately tiny: it must run before Node exists,
# so it cannot depend on anything Node provides.
[[bin]]
name = "rn"
path = "src/main.rs"

# The same launcher without a console window, for Windows: what the installer
# starts at sign-in. main.rs compiled again for the GUI subsystem — see
# src/console.rs. Elsewhere it is simply a second copy of rn, and unshipped.
[[bin]]
name = "rnw"
path = "src/rnw.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Ctrl-C on Unix and Windows alike. "termination" also catches SIGTERM/SIGHUP,
# which is how a service manager stops us.
ctrlc = { version = "3.4", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
# Only for kill(2): we forward SIGTERM so Node can shut down gracefully.
# Child::kill() would send SIGKILL and give it no chance to close its server.
libc = "0.2"
