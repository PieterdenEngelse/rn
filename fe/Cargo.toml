[package]
name = "fe"
version = "0.1.0"
authors = ["pde"]
edition = "2021"

[dependencies]
# The wire types, defined once. default-features = false switches off the
# `typescript` feature so ts-rs never reaches the wasm bundle — this crate is
# compiled to wasm and anything pulled in here ships to the browser.
shared = { path = "../shared", default-features = false }
dioxus = { version = "=0.7.9", features = ["web"] }
manganis = "0.7"
dioxus-router = { version = "=0.7.9" }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "Navigator", "Clipboard", "RequestMode", "Location"] }
wasm-bindgen = "0.2"
# Already in the tree via web-sys; named directly for Date::now() on the Jobs page.
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
