[package]
name = "fe"
version = "0.1.0"
authors = ["pde"]
edition = "2021"

[dependencies]
dioxus = { version = "=0.7.9", features = ["web"] }
manganis = "0.7"
dioxus-router = { version = "=0.7.9" }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "Navigator", "Clipboard"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
