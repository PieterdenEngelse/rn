[package]
name = "fe"
version = "0.1.0"
authors = ["pde"]
edition = "2021"

[dependencies]
dioxus = { version = "=0.7.9", features = ["web"] }
manganis = "0.7"
dioxus-router = { version = "=0.7.9" }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList"] }
wasm-bindgen = "0.2"

[features]
default = ["web"]
web = ["dioxus/web"]
