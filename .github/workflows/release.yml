# Build, sign, test and publish a release.
#
#   push a v* tag      build everything, sign the Windows files if a
#                      certificate is configured, test, publish the release
#   pull request       build and test only, when something that goes into a
#                      package changes
#   Run workflow       the same build and test, by hand, from the Actions tab
#
# scripts/release.sh is what pushes the tag. The build lives here rather than
# on the developer machine so that every release comes from a commit anyone can
# check out, with the certificate kept in repository secrets rather than on a
# laptop, and so the Windows half is installed on real Windows before it ships.
#
# Three stages, two operating systems:
#
#   build     (Linux)    package.sh builds both package trees — the Windows one
#                        is cross-built, one build script for both — and the
#                        Linux one is smoke-tested in clean containers.
#   windows   (Windows)  RERAG's signing pipeline around the MSI: rn.exe is
#                        signed with signtool, the MSI is built with WiX v5
#                        (a setup wizard, which Linux tooling cannot build),
#                        and the MSI is signed. No WINDOWS_PFX_BASE64 secret:
#                        unsigned, and nothing fails.
#   windows-test         screenshots every page of the wizard, then installs
#                        silently, checks rn answers, and uninstalls.
#
# docs/signing.md says what the certificate has to be for Smart App Control to
# accept it.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "launcher/**"
      - "be/package.json"
      - "be/package-lock.json"
      - "be/.nvmrc"
      - "scripts/package.sh"
      - "scripts/package-msi.ps1"
      - "scripts/msi/**"
      - "scripts/install-node.sh"
      - "scripts/release-notes.sh"
      - "scripts/smoke-release.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the packages, smoke-test Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git describe in the BUILD stamp needs history and tags.
          fetch-depth: 0

      - name: Version, and whether this run publishes
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "::error::no version in launcher/Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The tag is the release's name and launcher/Cargo.toml is its
            # version; a mismatch would publish v0.1.7 carrying a 0.1.6 MSI,
            # which Windows would then refuse to upgrade from.
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match launcher/Cargo.toml version $version"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version-test" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: System packages
        # llvm provides llvm-rc for rn.exe's version resource
        # (launcher/build.rs); clang and lld are what cargo-xwin compiles and
        # links the Windows launcher with.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends llvm clang lld
          llvm-rc --version | head -1 || { echo "::error::llvm-rc is not on PATH"; exit 1; }

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-msvc, wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo-xwin's MSVC CRT and SDK
        # cargo-xwin downloads Microsoft's CRT and SDK headers on first use:
        # over seven minutes, for files that only change when cargo-xwin does.
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-v1

      - name: Node, for npm at build time
        # The packages carry their own Node (install-node.sh); this one only
        # runs npm ci and the stylesheet build. Same version as be/.nvmrc.
        uses: actions/setup-node@v7
        with:
          node-version-file: be/.nvmrc

      - name: cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      - name: cargo-xwin and dx
        # dx pinned to the dioxus version fe/Cargo.toml pins, since a dx that
        # does not match the library produces a bundle that fails at runtime.
        run: |
          dioxus=$(sed -n 's/^dioxus = { version = "=\([0-9.]*\)".*/\1/p' fe/Cargo.toml)
          [ -n "$dioxus" ] || { echo "::error::could not read the dioxus version from fe/Cargo.toml"; exit 1; }
          cargo binstall --no-confirm --locked cargo-xwin "dioxus-cli@$dioxus"
          dx --version

      - name: Node release keys
        # install-node.sh --require-sig checks the runtime's signature against
        # the default keyring (docs/packaging.md section 4). The same eight
        # primary release keys the dev machine imports, pinned by fingerprint,
        # and each downloaded file is imported only if it holds that key.
        run: |
          for fp in \
            5BE8A3F6C8A5C01D106C0AD820B1A390B168D356 \
            DD792F5973C6DE52C432CBDAC77ABFA00DDBF2B7 \
            CC68F5A3106FF448322E48ED27F5E38D5B0A215F \
            890C08DB8579162FEE0DF9DB8BEAB4DFCF555EF4 \
            C82FA3AE1CBEDC6BE46B9360C43CEC45C17AB93C \
            108F52B48DB57BB0CC439B2997B01419BD92F80A \
            655F3B5C1FB3FA8D1A0CA6BDE4A7D232B936D2FD \
            A363A499291CBBC940DD62E41F10027AF002F8B0
          do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/nodejs/release-keys/HEAD/keys/$fp.asc" -o "$RUNNER_TEMP/$fp.asc"
            got=$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/$fp.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
            [ "$got" = "$fp" ] || { echo "::error::key file for $fp holds ${got:-no key}"; exit 1; }
            gpg --batch --quiet --import "$RUNNER_TEMP/$fp.asc"
          done

      - name: Frontend dependencies
        # package.sh builds the stylesheet with fe's tailwind, which a dev
        # checkout already has installed and a fresh one does not.
        run: npm ci --prefix fe --no-audit --no-fund

      - name: Linux package
        run: scripts/package.sh

      - name: Windows package
        run: scripts/package.sh --target windows

      - name: Smoke-test the Linux package in clean containers
        run: scripts/smoke-release.sh --package dist/rn

      - name: Linux assets
        run: |
          mkdir -p out/linux
          tar czf out/linux/rn-linux-x64.tar.gz -C dist rn
          (cd out/linux && sha256sum rn-linux-x64.tar.gz > rn-linux-x64.tar.gz.sha256)
          cp dist/rn/BUILD out/linux/BUILD

      - name: Upload the Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/linux/
          if-no-files-found: error

      - name: Upload the Windows package tree
        uses: actions/upload-artifact@v7
        with:
          name: windows-tree
          path: dist/rn-win/
          if-no-files-found: error

  windows:
    name: Sign, build the MSI, sign it
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.sign.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Windows package tree
        uses: actions/download-artifact@v8
        with:
          name: windows-tree
          path: dist/rn-win

      - name: WiX v5 and its UI extension
        # v5 rather than v6/v7, whose binaries come with a maintenance-fee
        # agreement to accept; scripts/msi/rn.wxs says why.
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix --version

      - name: Configure code signing
        # Decode the certificate from the WINDOWS_PFX_BASE64 secret and put
        # signtool on PATH. Every signing step below is gated on
        # steps.sign.outputs.enabled, so with no secret set the build stays
        # UNSIGNED and nothing here fails. A self-signed .pfx proves the
        # pipeline end to end, but Windows does not trust it: Smart App Control
        # still blocks what it signs.
        id: sign
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host "::notice::No WINDOWS_PFX_BASE64 secret: rn.exe and the MSI will be UNSIGNED."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          # signtool.exe ships with the Windows 10 SDK but isn't on PATH.
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { Write-Error "signtool.exe not found in the Windows SDK"; exit 1 }
          $st.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "pfx=$pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Code signing enabled (signtool: $($st.FullName))"

      - name: Sign rn.exe
        # Before the MSI is built, so the copies inside the MSI and the zip
        # carry the signature too. RFC 3161 timestamp keeps the signature valid
        # past the certificate's expiry.
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX: ${{ steps.sign.outputs.pfx }}
          PFX_PW: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          # Both launchers: rn.exe for a terminal, rnw.exe (no console window)
          # for what the installer starts.
          foreach ($exe in "rn.exe", "rnw.exe") {
            signtool sign /f "$env:PFX" /p "$env:PFX_PW" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\rn-win\$exe"
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for $exe"; exit 1 }
            Write-Host "  signed $exe -> $((Get-AuthenticodeSignature "dist\rn-win\$exe").Status)"
          }

      - name: Build the MSI
        shell: pwsh
        run: .\scripts\package-msi.ps1

      - name: Sign the MSI
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX: ${{ steps.sign.outputs.pfx }}
          PFX_PW: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          signtool sign /f "$env:PFX" /p "$env:PFX_PW" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "rn" dist\rn-windows-x64.msi
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for the MSI"; exit 1 }
          Write-Host "  signed the MSI -> $((Get-AuthenticodeSignature dist\rn-windows-x64.msi).Status)"

      - name: Remove the decoded certificate
        if: always() && steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "codesign.pfx") -Force -ErrorAction SilentlyContinue

      - name: Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\windows | Out-Null
          # The zip holds one rn-win directory, which install.ps1 -FromRelease
          # looks inside for rn.exe. PowerShell 7 writes forward-slash entries.
          Compress-Archive -Path dist\rn-win -DestinationPath out\windows\rn-windows-x64.zip
          Copy-Item dist\rn-windows-x64.msi out\windows\
          # After signing: a signature changes the bytes a checksum describes.
          # sha256sum's own "<hash>  <name>" format, which install.ps1 reads.
          foreach ($f in "rn-windows-x64.zip", "rn-windows-x64.msi") {
            $h = (Get-FileHash "out\windows\$f" -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("out\windows\$f.sha256", "$h  $f`n")
          }
          Get-ChildItem out\windows | Format-Table Name, Length

      - name: Upload the Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/windows/
          if-no-files-found: error

  windows-test:
    name: Walk through the wizard, install the MSI, uninstall
    needs: [build, windows]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download the Windows assets
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: assets

      - name: Screenshot every page of the setup wizard
        # Opens the MSI the way a double-click does, captures each page,
        # and cancels on the Ready page, so nothing is installed. The images
        # are uploaded, to be looked at: nothing here can judge whether a page
        # reads well. Allowed to fail, since it depends on the runner's desktop.
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $shots = Join-Path $env:RUNNER_TEMP "wizard"
          New-Item -ItemType Directory -Force $shots | Out-Null
          $wsh = New-Object -ComObject WScript.Shell
          function Shot($name) {
            Start-Sleep -Seconds 2
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $shots "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "  captured $name"
          }
          function Keys($k) { [void]$wsh.AppActivate("rn Setup"); Start-Sleep -Milliseconds 400; $wsh.SendKeys($k) }

          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$((Resolve-Path assets\rn-windows-x64.msi).Path)`"" -PassThru
          foreach ($i in 1..30) { if ($wsh.AppActivate("rn Setup")) { break }; Start-Sleep -Seconds 1 }
          Shot "1-welcome"
          Keys "%n"; Shot "2-what-happens"
          Keys "%n"; Shot "3-license"
          Keys "%a"; Start-Sleep -Milliseconds 500; Keys "%n"; Shot "4-ready"
          Keys "{ESC}"; Start-Sleep -Seconds 1; Keys "%y"; Shot "5-cancelled"
          Keys "{ENTER}"
          Start-Sleep -Seconds 3
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\rn\rn.exe")) {
            Write-Host "::error::cancelling the wizard left rn installed"; exit 1
          }

      - name: Upload the wizard screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wizard-screenshots
          path: ${{ runner.temp }}/wizard/
          if-no-files-found: warn

      - name: Install silently, check, uninstall
        shell: pwsh
        env:
          SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          $ErrorActionPreference = "Stop"
          $msi    = (Resolve-Path assets\rn-windows-x64.msi).Path
          $prefix = Join-Path $env:LOCALAPPDATA "Programs\rn"
          $run    = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $menu   = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\rn.lnk"
          function Fail($m) { Write-Host "::error::$m"; exit 1 }
          function Msi($verb, $log, $extra) {
            $a = @($verb, "`"$msi`"", "/qn", "/l*v", "`"$log`"") + $extra
            $p = Start-Process msiexec.exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { Fail "msiexec $verb exited $($p.ExitCode); see the uploaded log" }
          }

          # Signed or not, say which, and when signing was on, require that a
          # signature is actually there. Status is Valid only for a certificate
          # this runner trusts; a self-signed one reads UnknownError, which
          # still proves the file was signed.
          Write-Host "==> signatures (signing: $env:SIGNED)"
          $s = Get-AuthenticodeSignature $msi
          Write-Host "  rn-windows-x64.msi: $($s.Status) $($s.SignerCertificate.Subject)"
          if ($env:SIGNED -eq "true" -and $s.Status -eq "NotSigned") { Fail "signing was on, but the MSI is not signed" }

          Write-Host "==> install"
          Msi "/i" "$env:RUNNER_TEMP\install.log" @()
          $s = Get-AuthenticodeSignature (Join-Path $prefix "rn.exe")
          Write-Host "  rn.exe signature: $($s.Status) $($s.SignerCertificate.Subject)"
          if ($env:SIGNED -eq "true" -and $s.Status -eq "NotSigned") { Fail "signing was on, but the installed rn.exe is not signed" }
          foreach ($f in "rn.exe", "rnw.exe", "rn.url", "runtime\bin\node.exe", "app\src\server.ts", "app\web\index.html") {
            if (-not (Test-Path (Join-Path $prefix $f))) { Fail "not installed: $prefix\$f" }
          }
          if (Test-Path (Join-Path $prefix "install.ps1")) { Fail "install.ps1 should not be in an MSI install" }
          $v = (Get-Item (Join-Path $prefix "rn.exe")).VersionInfo
          Write-Host "  rn.exe: ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion)"
          if ($v.ProductName -ne "rn" -or $v.ProductVersion -ne "${{ needs.build.outputs.version }}") {
            Fail "rn.exe version information is '$($v.ProductName)' '$($v.ProductVersion)'"
          }
          if ((Get-ItemProperty $run -Name rn -ErrorAction SilentlyContinue).rn -ne "`"$prefix\rnw.exe`"") { Fail "the Run entry does not start rnw.exe" }
          if (-not (Test-Path $menu)) { Fail "no Start Menu entry at $menu" }

          Write-Host "==> the MSI started rn; waiting for it to answer"
          $up = $false
          foreach ($i in 1..90) {
            try { $h = Invoke-WebRequest http://127.0.0.1:3010/api/health -UseBasicParsing -TimeoutSec 2; $up = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) {
            Get-Process | Where-Object { $_.Path -like "$prefix*" } | Format-Table Id, ProcessName, Path | Out-String | Write-Host
            Fail "rn did not answer /api/health within 90 seconds of the install"
          }
          Write-Host "  health: $($h.StatusCode) $($h.Content.Substring(0, [Math]::Min(100, $h.Content.Length)))"
          $page = Invoke-WebRequest http://127.0.0.1:3010/ -UseBasicParsing -TimeoutSec 5
          Write-Host "  page:   $($page.StatusCode)"
          if ($page.StatusCode -ne 200) { Fail "the page did not load" }

          # The point of rnw.exe: nothing rn started has a window, and the log
          # went to the file instead. conhost.exe is what backs a console
          # window, so a console child of rn would show up as one.
          Write-Host "==> no console windows"
          $ours = @(Get-Process | Where-Object { $_.Path -like "$prefix*" })
          foreach ($p in $ours) {
            Write-Host "  $($p.ProcessName) pid=$($p.Id) window=$($p.MainWindowHandle)"
            if ($p.MainWindowHandle -ne 0) { Fail "$($p.ProcessName) has a window" }
          }
          if (-not ($ours.ProcessName -contains "rnw")) { Fail "rnw is not what is running" }
          $ids = $ours.Id
          $consoles = @(Get-CimInstance Win32_Process -Filter "Name = 'conhost.exe'" | Where-Object { $ids -contains $_.ParentProcessId })
          if ($consoles.Count -gt 0) { Fail "a console host was started for rn's processes" }
          $log = Join-Path $env:USERPROFILE ".local\state\rn\rn.log"
          if (-not (Test-Path $log)) { Fail "no log at $log" }
          $listening = Select-String -Path $log -Pattern '"step":"listening"' -Quiet
          Write-Host "  log: $log ($((Get-Item $log).Length) bytes, listening line: $listening)"
          if (-not $listening) { Fail "the log has no listening line from Node" }

          Write-Host "==> uninstall, with rn still running"
          Set-Content (Join-Path $prefix "app\.env") "BACKEND_PORT=3010"
          Msi "/x" "$env:RUNNER_TEMP\uninstall.log" @()
          Start-Sleep -Seconds 2
          $left = @(Get-Process | Where-Object { $_.Path -like "$prefix*" })
          if ($left.Count -gt 0) { Fail "still running after uninstall: $($left.ProcessName -join ', ')" }
          if (Test-Path (Join-Path $prefix "rn.exe")) { Fail "rn.exe is still there after uninstall" }
          if (-not (Test-Path (Join-Path $prefix "app\.env"))) { Fail "uninstall removed the user's app\.env" }
          if (Get-ItemProperty $run -Name rn -ErrorAction SilentlyContinue) { Fail "the Run entry survived uninstall" }
          if (Test-Path $menu) { Fail "the Start Menu entry survived uninstall" }

          Write-Host "==> install with AUTOSTART cleared: no Run entry"
          Msi "/i" "$env:RUNNER_TEMP\install-noautostart.log" @('AUTOSTART=""')
          if (Get-ItemProperty $run -Name rn -ErrorAction SilentlyContinue) { Fail "AUTOSTART was cleared, but a Run entry was written" }
          Msi "/x" "$env:RUNNER_TEMP\uninstall-noautostart.log" @()
          Write-Host "PASS"

      - name: Upload the installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  publish:
    name: Publish the release
    needs: [build, windows, windows-test]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Linux assets
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: out/linux

      - name: Download the Windows assets
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: out/windows

      - name: Notes and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SIGNED: ${{ needs.windows.outputs.signed == 'true' && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          # install-rn.cmd rides along for the links that already point at it
          # (releases/latest/download/install-rn.cmd). CRLF, which cmd.exe needs.
          grep -q $'\r$' scripts/install-rn.cmd || { echo "::error::scripts/install-rn.cmd lost its CRLF endings"; exit 1; }
          scripts/release-notes.sh --tag "$TAG" --commit "$GITHUB_SHA" --build out/linux/BUILD \
              --signed "$SIGNED" --repo "$GITHUB_REPOSITORY" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "rn $TAG" --notes-file notes.md \
              out/linux/rn-linux-x64.tar.gz out/linux/rn-linux-x64.tar.gz.sha256 \
              out/windows/rn-windows-x64.zip out/windows/rn-windows-x64.zip.sha256 \
              out/windows/rn-windows-x64.msi out/windows/rn-windows-x64.msi.sha256 \
              scripts/install-rn.cmd
          echo "published $TAG (Windows files signed: $SIGNED)"
