# Build, test, sign and publish a release.
#
#   push a v* tag      build everything, test it, sign the Windows files if
#                      SignPath is configured, publish the GitHub release
#   pull request       build and test only, when something that goes into a
#                      package changes
#   Run workflow       the same build and test, by hand, from the Actions tab
#
# scripts/release.sh is what pushes the tag. The build itself lives here rather
# than on the developer machine for one reason: SignPath Foundation signs only
# what a GitHub-hosted runner built, from a commit anyone can check out, and
# every job leading up to the signing request has to have run on one. A release
# built on a laptop cannot be signed, however carefully it was built.
#
# The Windows half is still cross-built on Linux with the same package.sh the
# dev machine runs, so there is one build script and not two. What is new is a
# job that installs the result on real Windows: before this workflow, nothing
# in the Windows half had ever run on Windows at all.
#
# Signing is off until the repository has the SignPath settings docs/signing.md
# lists. Until then a tag publishes unsigned Windows files and the release
# notes say so. Once it is on, a release that fails to sign is not published.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "launcher/**"
      - "be/package.json"
      - "be/package-lock.json"
      - "be/.nvmrc"
      - "scripts/package.sh"
      - "scripts/package-msi.sh"
      - "scripts/rn.wxs"
      - "scripts/install-node.sh"
      - "scripts/release-notes.sh"
      - "scripts/smoke-release.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and smoke-test the packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git describe in the BUILD stamp needs history and tags.
          fetch-depth: 0

      - name: Version, and whether this run publishes
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "::error::no version in launcher/Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The tag is the release's name and launcher/Cargo.toml is its
            # version; a mismatch would publish v0.1.7 carrying a 0.1.6 MSI,
            # which Windows would then refuse to upgrade from.
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match launcher/Cargo.toml version $version"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version-test" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: System packages
        # msitools/wixl build the MSI; llvm provides llvm-rc for rn.exe's
        # version resource (launcher/build.rs); clang and lld are what
        # cargo-xwin compiles and links the Windows launcher with; zip packs
        # the Windows asset.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wixl msitools llvm clang lld zip
          llvm-rc --version | head -1 || { echo "::error::llvm-rc is not on PATH"; exit 1; }

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-msvc, wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo-xwin's MSVC CRT and SDK
        # cargo-xwin downloads Microsoft's CRT and SDK headers on first use:
        # 7m28s on the first run of this workflow, for files that only change
        # when cargo-xwin does.
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-v1

      - name: Node, for npm at build time
        # The packages carry their own Node (install-node.sh); this one only
        # runs npm ci and the stylesheet build. Same version as be/.nvmrc.
        uses: actions/setup-node@v7
        with:
          node-version-file: be/.nvmrc

      - name: cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      - name: cargo-xwin and dx
        # dx pinned to the dioxus version fe/Cargo.toml pins, since a dx that
        # does not match the library produces a bundle that fails at runtime.
        run: |
          dioxus=$(sed -n 's/^dioxus = { version = "=\([0-9.]*\)".*/\1/p' fe/Cargo.toml)
          [ -n "$dioxus" ] || { echo "::error::could not read the dioxus version from fe/Cargo.toml"; exit 1; }
          cargo binstall --no-confirm --locked cargo-xwin "dioxus-cli@$dioxus"
          dx --version

      - name: Node release keys
        # install-node.sh --require-sig checks the runtime's signature against
        # the default keyring (docs/packaging.md section 4). The same eight
        # primary release keys the dev machine imports, pinned by fingerprint,
        # and each downloaded file is imported only if it holds that key.
        run: |
          for fp in \
            5BE8A3F6C8A5C01D106C0AD820B1A390B168D356 \
            DD792F5973C6DE52C432CBDAC77ABFA00DDBF2B7 \
            CC68F5A3106FF448322E48ED27F5E38D5B0A215F \
            890C08DB8579162FEE0DF9DB8BEAB4DFCF555EF4 \
            C82FA3AE1CBEDC6BE46B9360C43CEC45C17AB93C \
            108F52B48DB57BB0CC439B2997B01419BD92F80A \
            655F3B5C1FB3FA8D1A0CA6BDE4A7D232B936D2FD \
            A363A499291CBBC940DD62E41F10027AF002F8B0
          do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/nodejs/release-keys/HEAD/keys/$fp.asc" -o "$RUNNER_TEMP/$fp.asc"
            got=$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/$fp.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
            [ "$got" = "$fp" ] || { echo "::error::key file for $fp holds ${got:-no key}"; exit 1; }
            gpg --batch --quiet --import "$RUNNER_TEMP/$fp.asc"
          done

      - name: Frontend dependencies
        # package.sh builds the stylesheet with fe's tailwind, which a dev
        # checkout already has installed and a fresh one does not.
        run: npm ci --prefix fe --no-audit --no-fund

      - name: Linux package
        run: scripts/package.sh

      - name: Windows package
        run: scripts/package.sh --target windows

      - name: MSI
        run: scripts/package-msi.sh

      - name: Smoke-test the Linux package in clean containers
        run: scripts/smoke-release.sh --package dist/rn

      - name: Assemble the assets
        run: |
          mkdir -p out/linux out/windows
          tar czf out/linux/rn-linux-x64.tar.gz -C dist rn
          (cd out/linux && sha256sum rn-linux-x64.tar.gz > rn-linux-x64.tar.gz.sha256)
          cp dist/rn/BUILD out/linux/BUILD
          (cd dist && zip -qry ../out/windows/rn-windows-x64.zip rn-win)
          cp dist/rn-windows-x64.msi out/windows/
          # The Windows checksums are written at publish time, after signing,
          # because a signature changes the bytes they would describe.
          ls -l out/linux out/windows

      - name: Upload the Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/linux/
          if-no-files-found: error

      - name: Upload the Windows assets (unsigned)
        id: upload-windows
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: out/windows/
          if-no-files-found: error

  windows-test:
    name: Install the MSI on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download the Windows assets
        uses: actions/download-artifact@v8
        with:
          name: windows-unsigned
          path: assets

      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi    = (Resolve-Path assets\rn-windows-x64.msi).Path
          $prefix = Join-Path $env:LOCALAPPDATA "Programs\rn"
          $run    = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $menu   = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\rn.lnk"
          function Fail($m) { Write-Host "::error::$m"; exit 1 }
          function Msi($verb, $log) {
            $p = Start-Process msiexec.exe -ArgumentList $verb, "`"$msi`"", "/qn", "/l*v", "`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Fail "msiexec $verb exited $($p.ExitCode); see the uploaded log" }
          }

          Write-Host "==> install"
          Msi "/i" "$env:RUNNER_TEMP\install.log"
          foreach ($f in "rn.exe", "rn.url", "runtime\bin\node.exe", "app\src\server.ts", "app\web\index.html") {
            if (-not (Test-Path (Join-Path $prefix $f))) { Fail "not installed: $prefix\$f" }
          }
          if (Test-Path (Join-Path $prefix "install.ps1")) { Fail "install.ps1 should not be in an MSI install" }
          $v = (Get-Item (Join-Path $prefix "rn.exe")).VersionInfo
          Write-Host "  rn.exe: ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion)"
          if ($v.ProductName -ne "rn" -or $v.ProductVersion -ne "${{ needs.build.outputs.version }}") {
            Fail "rn.exe version information is '$($v.ProductName)' '$($v.ProductVersion)'"
          }
          if ((Get-ItemProperty $run -Name rn -ErrorAction SilentlyContinue).rn -ne "`"$prefix\rn.exe`"") { Fail "no Run entry for rn" }
          if (-not (Test-Path $menu)) { Fail "no Start Menu entry at $menu" }

          Write-Host "==> the MSI started rn; waiting for it to answer"
          $up = $false
          foreach ($i in 1..90) {
            try { $h = Invoke-WebRequest http://127.0.0.1:3010/api/health -UseBasicParsing -TimeoutSec 2; $up = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) {
            Get-Process | Where-Object { $_.Path -like "$prefix*" } | Format-Table Id, ProcessName, Path | Out-String | Write-Host
            Fail "rn did not answer /api/health within 90 seconds of the install"
          }
          Write-Host "  health: $($h.StatusCode) $($h.Content.Substring(0, [Math]::Min(100, $h.Content.Length)))"
          $page = Invoke-WebRequest http://127.0.0.1:3010/ -UseBasicParsing -TimeoutSec 5
          Write-Host "  page:   $($page.StatusCode)"
          if ($page.StatusCode -ne 200) { Fail "the page did not load" }

          Write-Host "==> uninstall, with rn still running"
          Set-Content (Join-Path $prefix "app\.env") "BACKEND_PORT=3010"
          Msi "/x" "$env:RUNNER_TEMP\uninstall.log"
          Start-Sleep -Seconds 2
          $left = @(Get-Process | Where-Object { $_.Path -like "$prefix*" })
          if ($left.Count -gt 0) { Fail "still running after uninstall: $($left.ProcessName -join ', ')" }
          if (Test-Path (Join-Path $prefix "rn.exe")) { Fail "rn.exe is still there after uninstall" }
          if (-not (Test-Path (Join-Path $prefix "app\.env"))) { Fail "uninstall removed the user's app\.env" }
          if (Get-ItemProperty $run -Name rn -ErrorAction SilentlyContinue) { Fail "the Run entry survived uninstall" }
          if (Test-Path $menu) { Fail "the Start Menu entry survived uninstall" }
          Write-Host "PASS"

      - name: Upload the installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  sign:
    name: Sign the Windows files (SignPath)
    needs: [build, windows-test]
    # Off until the SignPath settings exist; docs/signing.md says which.
    if: needs.build.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Submit for signing, and wait for approval
        # Every release waits here for a person to approve it in SignPath:
        # manual approval is a condition of the SignPath Foundation certificate.
        # An hour, then the run fails and nothing is published.
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.windows-artifact-id }}
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Upload the signed Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-signed
          path: signed/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, windows-test, sign]
    # always() so a skipped sign job (signing not configured) does not skip
    # this one; a failed sign job still stops it.
    if: >-
      always() &&
      needs.build.outputs.publish == 'true' &&
      needs.windows-test.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Linux assets
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: out/linux

      - name: Download the Windows assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign.result == 'success' && 'windows-signed' || 'windows-unsigned' }}
          path: out/windows

      - name: Checksums, notes, release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SIGNED: ${{ needs.sign.result == 'success' && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          (cd out/windows && for f in rn-windows-x64.zip rn-windows-x64.msi; do sha256sum "$f" > "$f.sha256"; done)
          # install-rn.cmd rides along for the links that already point at it
          # (releases/latest/download/install-rn.cmd). CRLF, which cmd.exe needs.
          grep -q $'\r$' scripts/install-rn.cmd || { echo "::error::scripts/install-rn.cmd lost its CRLF endings"; exit 1; }
          scripts/release-notes.sh --tag "$TAG" --commit "$GITHUB_SHA" --build out/linux/BUILD \
              --signed "$SIGNED" --repo "$GITHUB_REPOSITORY" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "rn $TAG" --notes-file notes.md \
              out/linux/rn-linux-x64.tar.gz out/linux/rn-linux-x64.tar.gz.sha256 \
              out/windows/rn-windows-x64.zip out/windows/rn-windows-x64.zip.sha256 \
              out/windows/rn-windows-x64.msi out/windows/rn-windows-x64.msi.sha256 \
              scripts/install-rn.cmd
          echo "published $TAG (Windows files signed: $SIGNED)"
